<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <title>Discussion Forum | Sign In</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'reg/css/style.css' %}">

    <style>
      body.liquid-bg {
        min-height: 100vh;
        margin: 0;
        /* iOS-inspired liquid mesh gradient background */
        background: radial-gradient(circle at 15% 20%, #1d4ed8 0%, transparent 45%),
                    radial-gradient(circle at 85% 80%, #6d28d9 0%, transparent 45%),
                    radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        background-attachment: fixed;
        display: flex;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      .login-card {
        /* iOS Liquid Frosted Glassmorphism */
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 24px;
        padding: 2.5rem 2.25rem;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      .login-card .form-control {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        color: #fff;
        height: 48px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .login-card .form-control::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      .login-card .form-control:focus {
        background: rgba(255, 255, 255, 0.16);
        border-color: #60a5fa;
        box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.25);
        color: #fff;
      }

      .login-card .btn-primary {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%) !important;
        border: none !important;
        border-radius: 12px;
        height: 48px;
        color: #fff !important;
        font-weight: 600;
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        transition: all 0.3s ease;
      }

      .login-card .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(59, 130, 246, 0.6);
      }

      .login-card .btn-outline-secondary-custom {
        background: rgba(255, 255, 255, 0.1) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        border-radius: 12px;
        height: 46px;
        color: #fff !important;
        font-weight: 500;
        transition: all 0.25s ease;
      }

      .login-card .btn-outline-secondary-custom:hover {
        background: rgba(255, 255, 255, 0.2) !important;
        border-color: rgba(255, 255, 255, 0.35) !important;
      }

      .field-icon {
        top: 52% !important;
      }
    </style>
  </head>
  <body class="liquid-bg">
    <section class="ftco-section w-100 py-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 text-center mb-3">
            <h2 class="heading-section" style="letter-spacing: 0.5px; font-weight: 700; color: #fff; font-size: 2rem;">Discussion Forum</h2>
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-4">
            <div class="login-wrap login-card">
              <h3 class="mb-4 text-center" style="color: #fff; font-weight: 600; font-size: 1.25rem;">Welcome Back</h3>
              <form action="{% url 'login' %}" class="signin-form" method="post" autocomplete="off">
                {% csrf_token %}
                <div class="form-group mb-3">
                  <input type="text" class="form-control" placeholder="Username" name="lo_name" required>
                </div>
                <div class="form-group mb-3 position-relative">
                  <input id="password-field" type="password" class="form-control" placeholder="Password" name="lo_pass" required>
                  <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password" style="color: rgba(255,255,255,0.7); cursor: pointer; position: absolute; right: 15px; transform: translateY(-50%);"></span>
                </div>
                <div class="form-group mb-3">
                  <button type="submit" class="form-control btn btn-primary submit px-3">Sign In</button>
                </div>
                <div class="form-group d-md-flex mb-3">
                  <div class="w-50">
                    <label class="checkbox-wrap checkbox-primary" style="color: rgba(255,255,255,0.8); font-size: 0.9rem;">Remember Me
                      <input type="checkbox" checked>
                      <span class="checkmark"></span>
                    </label>
                  </div>
                  <div class="w-50 text-md-right">
                    <a href="#" style="color: #fff"></a>
                  </div>
                </div>
              </form>

              <p class="w-100 text-center mt-2 mb-3" style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">&mdash; New to the platform? &mdash;</p>

              <div class="form-group mb-2">
                <a href="{% url 'reg_page' %}" class="form-control btn btn-outline-secondary-custom px-3 d-flex align-items-center justify-content-center text-decoration-none">Sign Up</a>
              </div>
              <div class="form-group mb-0">
                <a href="{% url 'admin_login_page' %}" class="form-control btn btn-outline-secondary-custom px-3 d-flex align-items-center justify-content-center text-decoration-none">Admin Login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      document.querySelector('.toggle-password').addEventListener('click', function () {
        var passwordField = document.querySelector('#password-field');
        var type = passwordField.type === 'password' ? 'text' : 'password';
        passwordField.type = type;
        this.classList.toggle('fa-eye-slash');
      });
    </script>

    <script src="{% static 'reg/js/jquery.min.js' %}"></script>
    <script src="{% static 'reg/js/popper.js' %}"></script>
    <script src="{% static 'reg/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'reg/js/main.js' %}"></script>
  </body>
</html>
