<!DOCTYPE html>
{% extends 'Add_Category.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="form-container">
            <div class="form-box">
                <h2>Edit Category</h2>
                <form method="post" enctype="multipart/form-data" action="{% url 'update_category' c_id=data.id %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="cat_name">Category Name:</label>
                        <input type="text" id="cat_name" name="cat_name" value="{{data.Cat_Name}}" required>
                    </div>
                    <div class="form-group">
                        <label for="cat_image">Category Image:</label>
                        <img src="{{data.Cat_Image.url}}" width="70px;" height="70px;">
                        <input type="file" id="cat_image" name="cat_image" accept="image/*" >
                    </div>
                    <button type="submit" class="submit-btn">Add Category</button>
                </form>
            </div>
        </div>
</body>
</html>
{% endblock %}
