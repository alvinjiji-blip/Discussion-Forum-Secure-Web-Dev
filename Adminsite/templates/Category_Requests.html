<!DOCTYPE html>
{% extends 'Add_Category.html' %}  <!-- Change 'base.html' to your actual base template -->
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users List</title>
</head>
<body>
<table class="table table-dark table-striped">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Username</th>
      <th scope="col">Category Name</th>
        <th scope="col">Created At</th>
      <th scope="col">Image</th>


      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
  {% for req in req %}
    <tr>
      <th scope="row">{{ forloop.counter }}</th>
      <td>{{ req.user }}</td>
      <td>{{ req.name }}</td>
      <td>{{ req.created_at }}</td>
      <td>
          {% if req.image %}
              <img src="{{ req.image.url }}" width="100px" height="100px">
          {% else %}
              No Image
          {% endif %}
      </td>
      <td>

          <a href="{% url 'delete_req' req.id %}" class="btn btn-danger">Delete</a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</body>
</html>
{% endblock %}
