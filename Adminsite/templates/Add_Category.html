
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #eef1f6;
        }

        /* Navbar */
        .navbar {
            background-color: #172554;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
        }

        /* Left Sidebar */
        .left-sidebar {
            width: 250px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 0px 8px rgba(0, 0, 0, 0.06);
        }

        .left-sidebar .btn {
            width: 100%;
            text-align: left;
            background-color: #f1f5f9;
            color: #263858;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px 12px;
            transition: all 0.25s ease;
        }

        .left-sidebar .btn:hover {
            background-color: #dbeafe;
            color: #1d4ed8;
            border-color: #bfdbfe;
            transform: translateX(4px);
        }

        /* Centered Form Section */
        .form-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .form-box {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(30, 41, 59, 0.08);
            width: 400px;
            border: 1px solid #e2e8f0;
            animation: fadeIn 0.7s ease;
            transition: box-shadow 0.3s ease;
        }

        .form-box:hover {
            box-shadow: 0 12px 30px rgba(30, 41, 59, 0.12);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e293b;
            font-size: 25px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 7px rgba(59, 130, 246, 0.18);
        }

        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.2);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .left-sidebar {
                width: 100%;
                padding: 15px;
            }

            .form-container {
                padding: 20px 15px;
            }

            .form-box {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h3 style="text-align:center; font-weight:bold;">Category</h3>
    </div>

    <!-- Main Content -->
    <div class="container">

        <!-- Left Sidebar -->
        <div class="left-sidebar" style="padding-top:50px;">
            <a href="{% url 'category_page' %}" class="btn btn-light">Add Category</a><br><br>
            <a href="{% url 'display_category' %}" class="btn btn-light">Display Category</a><br><br>
            <a href="{% url 'display_users' %}" class="btn btn-light">Display User</a><br><br>
            <a href="{% url 'display_request' %}" class="btn btn-light">Display Requests</a>
        </div>

        {% block content %}

        <!-- Form Section -->
        <div class="form-container">
            <div class="form-box">
                <h2>Add Category</h2>

                <form method="post" enctype="multipart/form-data" action="{% url 'save_category' %}">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="cat_name">Category Name:</label>
                        <input type="text" id="cat_name" name="cat_name" required>
                    </div>

                    <div class="form-group">
                        <label for="cat_image">Category Image:</label>
                        <input type="file" id="cat_image" name="cat_image" accept="image/*" required>
                    </div>

                    <button type="submit" class="submit-btn">Add Category</button>
                </form>
            </div>
        </div>

        {% endblock %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-Yvpcr1KZy9pISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></script>

</body>
</html>
