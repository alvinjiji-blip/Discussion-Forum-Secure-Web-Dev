
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
        }

        /* Navbar */
        .navbar {
            position: relative;
            background: #172554;
            color: white;
            padding: 17px 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .navbar h3 {
            margin: 0;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .login-btn {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            color: #172554;
            padding: 9px 15px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #dbeafe;
            color: #1d4ed8;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            min-height: calc(100vh - 62px);
        }

        /* Sidebar */
        .left-sidebar {
            width: 250px;
            min-width: 250px;
            background: #ffffff;
            padding: 35px 18px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.04);
            border-right: 1px solid #e8edf3;
        }

        .sidebar-heading {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin: 0 0 18px 10px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 13px;
            width: 100%;
            padding: 13px 14px;
            background: transparent;
            color: #475569;
            border: 1px solid transparent;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .sidebar-menu a i {
            width: 19px;
            text-align: center;
            font-size: 16px;
            color: #64748b;
        }

        .sidebar-menu a:hover {
            background: #eff6ff;
            color: #2563eb;
            border-color: #dbeafe;
            transform: translateX(3px);
        }

        .sidebar-menu a:hover i {
            color: #2563eb;
        }

        /* Main Content */
        .content-area {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        /* Add Category Form */
        .form-container {
            min-height: calc(100vh - 125px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(30, 41, 59, 0.08);
            width: 400px;
            max-width: 100%;
            border: 1px solid #e2e8f0;
            animation: fadeIn 0.5s ease;
            transition: box-shadow 0.3s ease;
        }

        .form-box:hover {
            box-shadow: 0 12px 30px rgba(30, 41, 59, 0.12);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e293b;
            font-size: 25px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            transition: 0.25s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 7px rgba(59, 130, 246, 0.18);
        }

        .submit-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }

            .left-sidebar {
                width: 100%;
                min-width: 0;
                padding: 20px;
            }

            .sidebar-menu {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .sidebar-menu a {
                padding: 12px 10px;
                font-size: 13px;
            }

            .content-area {
                padding: 15px;
            }

            .form-container {
                padding: 15px 0;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 16px 110px 16px 10px;
            }

            .navbar h3 {
                font-size: 19px;
            }

            .login-btn {
                right: 10px;
                font-size: 11px;
                padding: 7px 9px;
            }

            .sidebar-menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h3>Category</h3>

        <a href="{% url 'user_login_page' %}" class="login-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">

        <!-- Sidebar -->
        <aside class="left-sidebar">

            <p class="sidebar-heading">Management Menu</p>

            <nav class="sidebar-menu">

                <a href="{% url 'category_page' %}">
                    <i class="fa-solid fa-circle-plus"></i>
                    <span>Add Category</span>
                </a>

                <a href="{% url 'display_category' %}">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Display Category</span>
                </a>

                <a href="{% url 'display_users' %}">
                    <i class="fa-solid fa-users"></i>
                    <span>Display Users</span>
                </a>

                <a href="{% url 'display_request' %}">
                    <i class="fa-solid fa-inbox"></i>
                    <span>Display Requests</span>
                </a>

            </nav>

        </aside>

        <!-- Content Area -->
        <main class="content-area">

            {% block content %}

            <div class="form-container">

                <div class="form-box">

                    <h2>Add Category</h2>

                    <!-- Django Messages -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" enctype="multipart/form-data" action="{% url 'save_category' %}">

                        {% csrf_token %}

                        <div class="form-group">
                            <label for="cat_name">Category Name:</label>
                            <input type="text" id="cat_name" name="cat_name" required>
                        </div>

                        <div class="form-group">
                            <label for="cat_image">Category Image:</label>
                            <input type="file" id="cat_image" name="cat_image" accept="image/*" required>
                        </div>

                        <button type="submit" class="submit-btn">
                            <i class="fa-solid fa-plus"></i> Add Category
                        </button>

                    </form>

                </div>

            </div>

            {% endblock %}

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
